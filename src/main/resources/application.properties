spring.application.name=mockmate-api
spring.profiles.default=dev
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.upload-dir=${UPLOAD_DIR:uploads}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://sachinworks.in,https://www.sachinworks.in}
app.openai.enabled=${OPENAI_ENABLED:false}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.password-reset.frontend-url=${APP_PASSWORD_RESET_FRONTEND_URL:https://sachinworks.in}
app.password-reset.expose-development-token=false

resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:}

app.oauth.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
