spring:
  datasource:
    url: jdbc:h2:mem:mockmate;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate.ddl-auto: create-drop
    open-in-view: false
server:
  port: ${PORT:8081}
app:
  jwt.secret: ${JWT_SECRET:development-only-secret-key-change-before-production}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  password-reset:
    expose-development-token: true
