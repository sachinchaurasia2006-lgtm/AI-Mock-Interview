spring:
  application.name: mockmate-api
  profiles.default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  servlet.multipart.max-file-size: 10MB
  servlet.multipart.max-request-size: 10MB
app:
  jwt.secret: ${JWT_SECRET}
  jwt.expiration-ms: 86400000
  upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://sachinworks.in,https://www.sachinworks.in}
  openai:
    enabled: ${OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  password-reset:
    frontend-url: ${APP_PASSWORD_RESET_FRONTEND_URL:https://sachinworks.in}
    expose-development-token: false
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:}
